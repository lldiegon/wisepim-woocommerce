name: wisepim-woocommerce-dev
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Set WORDPRESS_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 20
  wordpress:
    image: wordpress:php8.2-apache
    ports:
      - '127.0.0.1:8889:80'
    environment: &wordpress-environment
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Set WORDPRESS_DB_PASSWORD in .env}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: '1'
    volumes: &wordpress-volumes
      - wordpress:/var/www/html
      - ./:/var/www/html/wp-content/plugins/wisepim-for-woocommerce:ro
    depends_on:
      db:
        condition: service_healthy
  cli:
    image: wordpress:cli-php8.2
    user: '33:33'
    environment: *wordpress-environment
    volumes: *wordpress-volumes
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
  wordpress:
